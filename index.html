<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PixelSave - Financial Manager 8-Bit</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'VT323', monospace;
      background: #0f172a;
      color: #f8fafc;
      touch-action: manipulation;
    }
    .pixel-title {
      font-family: 'Press Start 2P', cursive;
    }
    .pixel-font {
      font-family: 'Silkscreen', cursive;
    }
    .pixel-box {
      border: 4px solid #1e293b;
      box-shadow: 4px 4px 0px #020617;
    }
    .pixel-card {
      border: 3px solid #000;
      box-shadow: 3px 3px 0px #000;
    }
    .pixel-btn {
      border: 3px solid #000;
      box-shadow: 0 4px 0 #000;
      transition: all 0.1s ease;
    }
    .pixel-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('pixelsave_v2_tx');
        return saved ? JSON.parse(saved) : [
          { id: 1, title: 'Gaji Bulanan', amount: 4500000, type: 'income', category: '💼 Gaji' },
          { id: 2, title: 'Beli Kopi & Snack', amount: 35000, type: 'expense', category: '☕ Makan' },
          { id: 3, title: 'Topup Game', amount: 120000, type: 'expense', category: '🎮 Hiburan' }
        ];
      });

      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [type, setType] = useState('expense');
      const [category, setCategory] = useState('☕ Makan');

      useEffect(() => {
        localStorage.setItem('pixelsave_v2_tx', JSON.stringify(transactions));
      }, [transactions]);

      const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
      const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
      const balance = totalIncome - totalExpense;

      const addTransaction = (e) => {
        e.preventDefault();
        if (!title || !amount) return;
        const newTx = {
          id: Date.now(),
          title,
          amount: parseInt(amount),
          type,
          category
        };
        setTransactions([newTx, ...transactions]);
        setTitle('');
        setAmount('');
      };

      const deleteTx = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
      };

      const formatRp = (num) => {
        return 'Rp ' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      };

      return (
        <div className="bg-slate-800 rounded-lg p-3 sm:p-4 border-4 border-slate-950 shadow-2xl">
          
          {/* Retro Window TopBar */}
          <div className="bg-indigo-600 p-2 mb-4 border-2 border-black flex justify-between items-center text-white">
            <div className="flex items-center gap-2">
              <span className="w-3 h-3 bg-red-500 rounded-full inline-block border border-black"></span>
              <span className="w-3 h-3 bg-yellow-400 rounded-full inline-block border border-black"></span>
              <span className="w-3 h-3 bg-green-500 rounded-full inline-block border border-black"></span>
              <span className="pixel-title text-xs ml-2 tracking-widest text-yellow-300">PIXELSAVE v1.0</span>
            </div>
            <span className="text-xs font-mono bg-black/40 px-2 py-0.5 rounded">8-BIT OS</span>
          </div>

          {/* Balance Card */}
          <div className="bg-amber-100 p-4 pixel-card mb-4 text-slate-900 relative overflow-hidden">
            <div className="flex justify-between items-start mb-1">
              <span className="pixel-font text-xs uppercase font-bold text-slate-700">TOTAL SALDO</span>
              <span className="text-2xl">💰</span>
            </div>
            <div className={`pixel-title text-xl sm:text-2xl my-2 ${balance < 0 ? 'text-red-600' : 'text-emerald-700'}`}>
              {formatRp(balance)}
            </div>
            <div className="grid grid-cols-2 gap-2 mt-3 pt-2 border-t-2 border-dashed border-slate-400 text-base">
              <div className="bg-emerald-200/80 p-1.5 rounded border border-emerald-800 text-emerald-900 font-bold">
                <span>⬇ Masuk</span>
                <p className="text-sm font-mono">{formatRp(totalIncome)}</p>
              </div>
              <div className="bg-rose-200/80 p-1.5 rounded border border-rose-800 text-rose-900 font-bold">
                <span>⬆ Keluar</span>
                <p className="text-sm font-mono">{formatRp(totalExpense)}</p>
              </div>
            </div>
          </div>

          {/* Form Input */}
          <form onSubmit={addTransaction} className="bg-slate-700 p-3 pixel-card mb-4 text-white space-y-3">
            <div className="flex justify-between items-center border-b border-slate-600 pb-1">
              <span className="pixel-font text-xs text-cyan-300">➕ TAMBAH CATATAN</span>
              <div className="flex gap-2">
                <button 
                  type="button" 
                  onClick={() => setType('expense')} 
                  className={`px-2 py-0.5 text-xs font-bold rounded ${type === 'expense' ? 'bg-rose-500 text-white' : 'bg-slate-600 text-slate-300'}`}
                >
                  Pengeluaran
                </button>
                <button 
                  type="button" 
                  onClick={() => setType('income')} 
                  className={`px-2 py-0.5 text-xs font-bold rounded ${type === 'income' ? 'bg-emerald-500 text-white' : 'bg-slate-600 text-slate-300'}`}
                >
                  Pemasukan
                </button>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs text-slate-300 mb-1">Keterangan</label>
                <input 
                  type="text" 
                  value={title} 
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder="e.g. Beli Makan" 
                  className="w-full p-1.5 bg-slate-900 border-2 border-slate-950 text-white text-base rounded focus:outline-none focus:border-cyan-400"
                />
              </div>
              <div>
                <label className="block text-xs text-slate-300 mb-1">Nominal (Rp)</label>
                <input 
                  type="number" 
                  value={amount} 
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="50000" 
                  className="w-full p-1.5 bg-slate-900 border-2 border-slate-950 text-white text-base rounded focus:outline-none focus:border-cyan-400"
                />
              </div>
            </div>

            <div className="flex gap-2 items-center pt-1">
              <select 
                value={category} 
                onChange={(e) => setCategory(e.target.value)}
                className="p-1.5 bg-slate-900 border-2 border-slate-950 text-white text-base rounded font-sans"
              >
                <option value="☕ Makan">☕ Makan</option>
                <option value="🎮 Hiburan">🎮 Hiburan</option>
                <option value="💼 Gaji">💼 Gaji</option>
                <option value="🛒 Belanja">🛒 Belanja</option>
                <option value="⚡ Tagihan">⚡ Tagihan</option>
              </select>
              <button 
                type="submit" 
                className="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 pixel-title text-xs py-2.5 pixel-btn uppercase font-bold"
              >
                SIMPAN CATATAN
              </button>
            </div>
          </form>

          {/* Transaction List */}
          <div className="bg-slate-900 p-3 pixel-card max-h-56 overflow-y-auto">
            <div className="flex justify-between items-center mb-2 pb-1 border-b border-slate-800">
              <span className="pixel-font text-xs text-yellow-400">📜 RIWAYAT TRANSAKSI</span>
              <span className="text-xs text-slate-400">{transactions.length} Item</span>
            </div>
            
            {transactions.length === 0 && (
              <p className="text-center text-slate-500 my-4 text-base">Belum ada transaksi terpasang.</p>
            )}

            <div className="space-y-2">
              {transactions.map((t) => (
                <div key={t.id} className="flex justify-between items-center bg-slate-800 p-2 border-2 border-slate-950 rounded text-base">
                  <div className="flex items-center gap-2">
                    <span className="text-xl bg-slate-900 p-1 rounded border border-slate-700">{t.category ? t.category.split(' ')[0] : '💸'}</span>
                    <div>
                      <p className="font-bold text-white leading-tight">{t.title}</p>
                      <p className="text-xs text-slate-400">{t.category}</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className={`font-mono font-bold text-base ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {t.type === 'income' ? '+' : '-'} {formatRp(t.amount)}
                    </span>
                    <button 
                      onClick={() => deleteTx(t.id)} 
                      className="text-rose-400 hover:bg-rose-950 p-1 rounded font-bold text-xs border border-rose-800"
                    >
                      ✖
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
