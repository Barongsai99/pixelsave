    <!-- Embedded Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Attempt registering root sw.js file first, fallback to blob worker
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PixelSave PWA] Service Worker registered via sw.js:', reg.scope);
            })
            .catch(() => {
              // Embedded inline Blob Service Worker fallback
              const swCode = `
                const CACHE_NAME = 'pixelsave-v1';
                self.addEventListener('install', (e) => {
                  e.waitUntil(self.skipWaiting());
                });
                self.addEventListener('activate', (e) => {
                  e.waitUntil(self.clients.claim());
                });
                self.addEventListener('fetch', (e) => {
                  if (e.request.method !== 'GET') return;
                  e.respondWith(
                    fetch(event.request).catch(() => caches.match(e.request))
                  );
                });
              `;
              try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(blobUrl, { scope: '/' })
                  .then((reg) => console.log('[PixelSave PWA] Inline Blob SW registered:', reg.scope))
                  .catch((err) => console.log('[PixelSave PWA] SW registration notice:', err));
              } catch(e) {}
            });
        });
      }
    </script>
